<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top-left brand mark -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <text x="22" y="30" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>
    <text x="64" y="32" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">Make It Global</text>
  </g>

  <!-- Badge -->
  <g transform="translate(80, 190)">
    <rect x="0" y="0" width="300" height="36" rx="18" fill="none" stroke="#38BDF8" stroke-opacity="0.4"/>
    <circle cx="20" cy="18" r="4" fill="#38BDF8"/>
    <text x="34" y="24" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="13" font-weight="500" fill="#38BDF8">AGENCE IMPLEMENTATION IA</text>
  </g>

  <!-- Headline -->
  <text x="80" y="310" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="700" fill="#FFFFFF">On implemente l'IA</text>
  <text x="80" y="392" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="700" fill="url(#accent)">dans votre entreprise.</text>

  <!-- Subheadline -->
  <text x="80" y="460" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400" fill="#9CA3AF">Outils metier - Agents IA - Automatisations - SEO automatise</text>

  <!-- Bottom row -->
  <g transform="translate(80, 540)">
    <text x="0" y="22" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="18" font-weight="500" fill="#FFFFFF">makeitglobal-agency.com</text>
  </g>

  <g transform="translate(760, 525)">
    <rect x="0" y="0" width="170" height="42" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="85" y="27" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">PoC en 2 semaines</text>
  </g>
  <g transform="translate(950, 525)">
    <rect x="0" y="0" width="170" height="42" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="85" y="27" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Audit gratuit</text>
  </g>

  <!-- Decorative bracket top-right -->
  <g transform="translate(1050, 80)" opacity="0.5">
    <path d="M 0 0 L 70 0 L 70 70" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <rect x="20" y="20" width="30" height="30" fill="none" stroke="#818CF8" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>
</svg>
